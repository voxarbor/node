<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Озвучка</title>
<meta name="description" content="Українська озвучка тексту, локально">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Озвучка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 12h4M13 12h4M7 15.5h8"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/><path d="M16 17l2 2 4-4"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
</svg>

<a class="skip-link" href="#view">Перейти до вмісту</a>

<div id="login" class="login" hidden>
  <form class="login-card card" id="login-form" novalidate>
    <img src="/icon-maskable-512.png" alt="" width="56" height="56" class="login-logo">
    <h1>Озвучка</h1>
    <p class="muted">Українська озвучка тексту на власному сервері</p>
    <div class="field">
      <label for="login-user">Користувач</label>
      <input id="login-user" name="username" autocomplete="username" value="" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="login-pass">Пароль</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="form-error" role="alert"></p>
    <button class="btn primary block" type="submit" id="login-submit">Увійти</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <a class="brand" href="#/speak" aria-label="Озвучка — на головну"><img src="/icon-maskable-512.png" alt="" width="28" height="28"><span>Озвучка</span></a>
    <nav class="tabbar" aria-label="Розділи">
      <a href="#/speak" data-tab="speak"><svg class="ic" aria-hidden="true"><use href="#i-speak"/></svg><span>Озвучити</span></a>
      <a href="#/history" data-tab="history"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg><span>Історія</span></a>
      <a href="#/tools" data-tab="tools"><svg class="ic" aria-hidden="true"><use href="#i-tools"/></svg><span>Інструменти</span></a>
    </nav>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="status-text">…</span></div>
    <button id="logout" class="icon-btn" type="button" aria-label="Вийти" title="Вийти"><svg class="ic" aria-hidden="true"><use href="#i-logout"/></svg></button>
  </header>
  <main id="view" tabindex="-1">
    <section id="v-speak" class="view" aria-labelledby="h-speak" hidden></section>
    <section id="v-history" class="view" aria-labelledby="h-history" hidden></section>
    <section id="v-tools" class="view" aria-labelledby="h-tools" hidden></section>
  </main>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<noscript><p class="noscript">Для роботи «Озвучки» потрібен JavaScript.</p></noscript>
</body>
</html>
