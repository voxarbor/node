# GPU node (NVIDIA, CUDA 12.8+ driver, nvidia-container-toolkit): STT, TTS and diarize on the GPU, the rest stays on
# the CPU.
#   docker compose -f compose.yaml -f compose.gpu.yaml --env-file .env up -d     (+ compose.ui.yaml for the web UI)
# Check first:  docker run --rm --gpus all ubuntu:24.04 nvidia-smi
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - { driver: nvidia, count: all, capabilities: [gpu, utility, compute] }

services:
  stt:
    <<: *gpu
    image: ${STT_GPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3}   # upstream CUDA build, pinned
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: ${NODE_GPUS:-all}
      WHISPER__COMPUTE_TYPE: ${STT_GPU_COMPUTE_TYPE:-float16}

  tts:
    <<: *gpu
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-tts-cuda:${VOXARBOR_NODE_TAG:-v0.18.6}
    environment:
      TTS_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: ${NODE_GPUS:-all}   # e.g. NODE_GPUS=0: only the first GPU
      QUEUE_MAX: ${TTS_GPU_QUEUE_MAX:-16}   # a GPU node is fast: let the coordinator queue more

  diarize:
    <<: *gpu
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-diarize-cuda:${VOXARBOR_NODE_TAG:-v0.18.6}
    environment:
      DIARIZE_ENGINE: pyannote   # community-1: better speaker counting; the CPU image keeps sherpa-onnx
      DIARIZE_DEVICE: cuda
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True   # less fragmentation: VRAM goes back after a job
      NVIDIA_VISIBLE_DEVICES: ${NODE_GPUS:-all}
    deploy:
      resources:
        limits: { memory: 6g }
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu, utility, compute] }

  node-info:
    <<: *gpu   # only to read the GPU name / VRAM / load with nvidia-smi
    environment:
      STT_DEVICE: cuda
      STT_IMAGE: ${STT_GPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3}
      DIARIZE_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-diarize-cuda:${VOXARBOR_NODE_TAG:-v0.18.6}
      TTS_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-tts-cuda:${VOXARBOR_NODE_TAG:-v0.18.6}

  # Remotion Render on a GPU node: gl stays swangle (CPU) by default: in WSL there is no NVIDIA Vulkan driver and
  # Chrome silently renders in software. The GPU here only lets gen see the GPU load (the owner playing = busy).
  gen:
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-gen:${VOXARBOR_NODE_TAG:-v0.18.6}
    environment:
      GEN_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: ${NODE_GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
    deploy:
      resources:
        limits: { cpus: "${GEN_CPUS:-0}", memory: "${GEN_MEM:-0}" }   # as in compose.yaml: no caps by default
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu, utility, compute, graphics] }
