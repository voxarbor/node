# VoxArbor Node: the voice services behind one gateway port. See docs/gateway.md; optional web UI: compose.ui.yaml.
#   cp .env.example .env && edit NODE_TOKEN && docker compose --env-file .env up -d
name: voxarbor-node

x-common: &common
  restart: unless-stopped
  environment: &env
    API_KEY: ${NODE_TOKEN:?set NODE_TOKEN in .env}
    NODE_MODE: ${NODE_MODE:-normal}   # gentle: one task at a time, half the CPU threads (docs/gateway.md)
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *common
    image: caddy:2.11.7
    ports: ["${GATEWAY_PORT:-127.0.0.1:8790}:8080"]   # loopback only: the node dials out, nothing calls in
    environment:
      NODE_TOKEN: ${NODE_TOKEN:?set NODE_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [node-info]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  node-info:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-node-info:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      VOXARBOR_NODE_VERSION: ${VOXARBOR_NODE_TAG:-v0.17.1}
      STT_MODEL: ${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      STT_IMAGE: ghcr.io/speaches-ai/speaches:0.8.3-cpu
      TTS_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-tts:${VOXARBOR_NODE_TAG:-v0.17.1}
      TRANSLATE_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-translate:${VOXARBOR_NODE_TAG:-v0.17.1}
      DIARIZE_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-diarize:${VOXARBOR_NODE_TAG:-v0.17.1}
      FETCH_IMAGE: ${REGISTRY:-ghcr.io/voxarbor}/node-fetch:${VOXARBOR_NODE_TAG:-v0.17.1}
    volumes:
      - updater-ctl:/ctl:ro       # node-updater status for /capabilities.updater
      - hf-cache:/hf:ro           # only to read the Whisper model's revision
      - /etc/os-release:/host/os-release:ro   # only the OS name for /capabilities.node.os (a file bind follows the symlink)
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

  stt:
    <<: *common
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu   # upstream public image, pinned
    environment:
      <<: *env
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: ${STT_THREADS:-4}
      WHISPER__TTL: "120"   # models leave memory after 2 min idle (owner 2026-11-17)
      ENABLE_UI: "false"
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    # the image's own command; NODE_MODE=gentle halves WHISPER__CPU_THREADS first
    command: ["sh", "-c", "if [ \"$$NODE_MODE\" = gentle ]; then t=$$((WHISPER__CPU_THREADS / 2)); export WHISPER__CPU_THREADS=$$((t > 0 ? t : 1)); fi; exec uvicorn --factory speaches.main:create_app --no-access-log"]   # no line per /health poll
    cpu_shares: ${NODE_CPU_SHARES:-256}   # batch: live TTS wins under contention; gentle nodes may set 128
    volumes:
      - hf-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        limits: { cpus: "${STT_CPUS:-4}", memory: 4g }

  tts:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-tts:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      ENABLE_UI: "false"   # compose.ui.yaml turns the web UI on
      IDLE_TTL: "120"
      TORCH_THREADS: ${TTS_THREADS:-2}
      TTS_DEFAULT_ENGINE: holos
      TTS_ENGINES: ${TTS_ENGINES:-holos}   # add ,styletts2 to enable StyleTTS2 (see NOTICE)
      TTS_STRESS: accentuk
      ACCENTUK_MODE: light          # the image carries the light assets; "full" needs the 2.6 GB volume (README)
      TTS_LEXICON: /config/tts-lexicon.txt
      TTS_VERBALIZER: accentuk
      TTS_JOBS_DIR: /jobs
      MALLOC_ARENA_MAX: "2"
    cpu_shares: ${NODE_CPU_SHARES:-1024}
    volumes:
      - tts-cache:/cache
      - tts-config:/config
      - tts-jobs:/jobs
    deploy:
      resources:
        limits: { cpus: "${TTS_CPUS:-4}", memory: 8g }

  translate:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-translate:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      TRANSLATE_MODEL: nllb-600m
      TRANSLATE_MAX_MODELS: "3"
      TRANSLATE_THREADS: ${TRANSLATE_THREADS:-2}
      TRANSLATE_NLLB: ${TRANSLATE_NLLB:-0}   # 1 = NLLB-200 fallback for other languages (CC-BY-NC, see NOTICE)
      IDLE_TTL: "120"
      MALLOC_ARENA_MAX: "2"
    cpu_shares: ${NODE_CPU_SHARES:-1024}
    volumes:
      - translate-cache:/cache
    deploy:
      resources:
        limits: { cpus: "${TRANSLATE_CPUS:-4}", memory: "${TRANSLATE_MEM:-4g}" }

  diarize:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-diarize:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      IDLE_TTL: "120"
      DIARIZE_THREADS: ${DIARIZE_THREADS:-2}
      MALLOC_ARENA_MAX: "2"
    cpu_shares: ${NODE_CPU_SHARES:-256}   # batch: live TTS wins under contention; gentle nodes may set 128
    tmpfs:
      - /tmp/diarize:uid=65534,gid=65534,size=3g
    deploy:
      resources:
        limits: { cpus: "${DIARIZE_CPUS:-4}", memory: 3g }

  # outbound link to a coordinator (docs/connect.md): only active with COORDINATOR_URL, otherwise it idles
  connector:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-connector:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      COORDINATOR_URL: ${COORDINATOR_URL:-}
      NODE_JOIN_CODE: ${NODE_JOIN_CODE:-}
      NODE_NAME: ${NODE_NAME:-}
      CONNECT_MAX_STREAMS: ${CONNECT_MAX_STREAMS:-16}
    volumes:
      - connector-state:/state
      - updater-ctl:/ctl          # tells node-updater the coordinator's desired version and the node's load
    depends_on: [gateway]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192m }

  # optional: YouTube metadata / subtitles / audio fetched from this node's IP (COMPOSE_PROFILES=fetch)
  fetch:
    <<: *common
    profiles: ["fetch"]
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-fetch:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      QUEUE_MAX: ${FETCH_QUEUE_MAX:-4}
      YTDLP_PROXY: ${YTDLP_PROXY:-}            # optional outbound proxy
      FETCH_MIN_INTERVAL_S: ${FETCH_MIN_INTERVAL_S:-3}     # at least this many seconds between YouTube requests
      FETCH_BOT_COOLDOWN_S: ${FETCH_BOT_COOLDOWN_S:-900}   # after a bot check: refuse everything this long
    volumes:
      - fetch-config:/config                  # optional cookies.txt
    tmpfs:
      - /tmp:uid=65534,gid=65534,size=512m
    deploy:
      resources:
        limits: { cpus: "${FETCH_CPUS:-1}", memory: 1g }

  # One-off: copies the Opus-MT models into the translate volume, only on install or when OPUS_MODELS_TAG changes:
  #   docker compose --profile init run --rm init-opus     (the installer / update.sh decide: docs/gateway.md)
  # The volume remembers the copied version in opus-mt/.models-version (translate /health: opus_models_version);
  # the image itself is then not needed on the node (prune.sh removes it).
  init-opus:
    profiles: ["init"]
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-models-opus:${OPUS_MODELS_TAG:-3}
    environment:
      OPUS_MODELS_TAG: ${OPUS_MODELS_TAG:-3}
    command: ["sh", "-c", "v=$$(cat /cache/opus-mt/.models-version 2>/dev/null); if [ \"$$v\" = \"$$OPUS_MODELS_TAG\" ]; then echo \"opus models $$v present\"; else mkdir -p /cache/opus-mt && cp -r /models/opus-mt/. /cache/opus-mt/ && touch /cache/opus-mt/.complete && echo \"$$OPUS_MODELS_TAG\" > /cache/opus-mt/.models-version && chown -R 65534:65534 /cache/opus-mt && echo \"opus models $$OPUS_MODELS_TAG installed\"; fi"]
    volumes:
      - translate-cache:/cache
    restart: "no"

  # Automatic updates (docs/updater.md): the only service with the docker socket; no port. Takes node files only from
  # a signed GitHub release of voxarbor/node, images by digest, updates in an idle window, rolls back on failure.
  # UPDATER_MODE=auto | notify | off in .env (the stricter of this and the coordinator's setting wins).
  updater:
    <<: *common
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-updater:${VOXARBOR_NODE_TAG:-v0.17.1}
    environment:
      <<: *env
      UPDATER_MODE: ${UPDATER_MODE:-auto}
      UPDATER_HEALTH_MIN: ${UPDATER_HEALTH_MIN:-10}
      UPDATER_ALLOW_DOWNGRADE: ${UPDATER_ALLOW_DOWNGRADE:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/node                   # this folder (compose files, .env); seen at its host path inside the updater
      - updater-ctl:/ctl
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # one-shot: the Whisper model into STT (idempotent)

  init-stt:
    image: ${REGISTRY:-ghcr.io/voxarbor}/node-node-info:${VOXARBOR_NODE_TAG:-v0.17.1}
    command: ["python", "init_models.py"]
    environment:
      <<: *env
      STT_MODEL: ${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    depends_on: [stt]
    restart: "no"

volumes:
  hf-cache:
  tts-cache:
  tts-config:
  tts-jobs:
  translate-cache:
  fetch-config:
  connector-state:
  updater-ctl:
