# NODE_MODE=gentle: the node leaves most of the machine to its owner. One task at a time (the connector tells the
# coordinator max_streams 1, so GPU work is serial too), half the CPU threads, low CPU weight (cpu_shares 128).
services:
  stt:
    cpu_shares: 128
    environment: { WHISPER__CPU_THREADS: "${STT_THREADS_GENTLE:-2}" }
  tts:
    cpu_shares: 128
    environment: { TORCH_THREADS: "${TTS_THREADS_GENTLE:-1}" }
  translate:
    cpu_shares: 128
    environment: { TRANSLATE_THREADS: "${TRANSLATE_THREADS_GENTLE:-1}" }
  diarize:
    cpu_shares: 128
    environment: { DIARIZE_THREADS: "${DIARIZE_THREADS_GENTLE:-1}" }
  connector:
    environment: { CONNECT_MAX_STREAMS: "1" }
