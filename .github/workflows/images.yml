# Worker-node images to GHCR (public): ghcr.io/voxarbor/node-<service>:<version> | sha-<short> | latest.
# A push to main rebuilds only the services whose directory changed; "Run workflow" or a change of the root
# VERSION (the VoxArbor Node release) rebuilds all, which then also carry the tag v<VERSION> (what nodes pin).
# Models are not part of these builds except the TTS weights already in its Dockerfile (see docs/worker.md).
# Base images (job "base") come first: node-base-av (python + ffmpeg) and node-base-torch:<torch>-<cpu|cu128>-<ver>
# on top of it; tts and diarize build FROM them (BASE_IMAGE), so a node stores the ffmpeg and torch layers once.
# Changing a base: bump services/base-*/VERSION and the BASE_IMAGE tags in the build matrix below.
name: images
on:
  push:
    branches: [main]
    paths: ["services/base-av/**", "services/base-torch/**", "services/tts/**", "services/translate/**", "services/diarize/**", "services/node-info/**", "services/fetch/**", "services/gen/**", "services/connector/**", "services/updater/**", "VERSION", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole push range (changed.sh)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: build missing or changed base images
        run: |
          av=ghcr.io/voxarbor/node-base-av:$(cat services/base-av/VERSION)
          tv=$(cat services/base-torch/VERSION)
          changed() { sh .github/changed.sh "${{ github.event.before }}" HEAD "^services/$1/" \
                      || ! docker manifest inspect "$2" >/dev/null 2>&1; }
          lbl="--label org.opencontainers.image.source=https://github.com/voxarbor/node"
          if changed base-av "$av"; then
            docker buildx build --push $lbl -t "$av" services/base-av; fi
          for v in cpu cu128; do
            t=ghcr.io/voxarbor/node-base-torch:2.11.0-$v-$tv
            if changed base-torch "$t" || changed base-av "$av"; then
              docker buildx build --push $lbl --build-arg BASE_AV="$av" --build-arg TORCH_VARIANT=$v -t "$t" services/base-torch; fi
          done
  build:
    needs: base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:  # image = what is pushed (node-<image>); args = extra build args
          - { service: tts, image: tts, args: "BASE_IMAGE=ghcr.io/voxarbor/node-base-torch:2.11.0-cpu-1" }
          - { service: tts, image: tts-cuda, args: "BASE_IMAGE=ghcr.io/voxarbor/node-base-torch:2.11.0-cu128-1" }   # GPU nodes
          - { service: translate, image: translate, args: "" }
          - { service: diarize, image: diarize, args: "BASE_IMAGE=ghcr.io/voxarbor/node-base-av:1" }
          - { service: diarize, image: diarize-cuda, args: "BASE_IMAGE=ghcr.io/voxarbor/node-base-torch:2.11.0-cu128-1\nDIARIZE_VARIANT=cuda" }   # GPU: pyannote
          - { service: gen, image: gen, args: "" }   # optional: Remotion Render (profile gen)
          - { service: node-info, image: node-info, args: "" }
          - { service: fetch, image: fetch, args: "" }
          - { service: connector, image: connector, args: "" }
          - { service: updater, image: updater, args: "" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole push range (changed.sh)
      - name: changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || sh .github/changed.sh "${{ github.event.before }}" HEAD \
               '^(services/${{ matrix.service }}/|services/base-|VERSION$|\.github/workflows/images\.yml)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - name: version
        if: steps.changed.outputs.build
        id: v
        run: |
          s=${{ matrix.service }}
          v=$(cat services/$s/VERSION)
          # v<VERSION> (what nodes pin) only for a release: a VERSION change or "Run workflow"; a plain push to main must
          # not move the tag of the current release onto untested images
          rel=""
          if [ "${{ github.event_name }}" = workflow_dispatch ] || sh .github/changed.sh "${{ github.event.before }}" HEAD '^VERSION$'; then
            rel="v$(cat VERSION)"; fi
          # a published release keeps its images: its tag is never moved onto another build (audit #19)
          if [ -n "$rel" ] && git ls-remote --exit-code --tags origin "refs/tags/$rel" >/dev/null 2>&1; then
            echo "::warning::$rel is already released: its images are not re-tagged"; rel=""; fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.build
      - uses: docker/login-action@v3
        if: steps.changed.outputs.build
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # an image whose sources did not change is not built again: its digest only gets the new tags. The key is the git
      # tree of the service and of the base images plus the build args. Not for connector, node-info and updater: the
      # release number is baked into them (they build in 1-2 min anyway).
      - name: reuse an image built from the same sources
        if: steps.changed.outputs.build
        id: reuse
        run: |
          img=ghcr.io/voxarbor/node-${{ matrix.image }}
          key=$( { git rev-parse HEAD:services/${{ matrix.service }} HEAD:services/base-av HEAD:services/base-torch; \
                   printf '%s' "${{ matrix.args }}"; } | sha256sum | cut -c1-16)
          echo "src=$img:src-$key" >> "$GITHUB_OUTPUT"
          case "${{ matrix.image }}" in connector|node-info|updater) exit 0;; esac
          if docker buildx imagetools inspect "$img:src-$key" >/dev/null 2>&1; then
            tags="-t $img:${{ steps.v.outputs.version }} -t $img:sha-${{ steps.v.outputs.sha }} -t $img:latest"
            [ -n "${{ steps.v.outputs.release }}" ] && tags="$tags -t $img:${{ steps.v.outputs.release }}"
            docker buildx imagetools create $tags "$img:src-$key"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "reused $img:src-$key"
          fi
      - name: free disk (the tts image is ~7 GB)
        if: steps.changed.outputs.build && !steps.reuse.outputs.reused && startsWith(matrix.image, 'tts')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.build && !steps.reuse.outputs.reused
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/voxarbor/node-${{ matrix.image }}:${{ steps.v.outputs.version }}
            ghcr.io/voxarbor/node-${{ matrix.image }}:sha-${{ steps.v.outputs.sha }}
            ghcr.io/voxarbor/node-${{ matrix.image }}:latest
            ${{ steps.v.outputs.release && format('ghcr.io/voxarbor/node-{0}:{1}', matrix.image, steps.v.outputs.release) || '' }}
            ${{ steps.reuse.outputs.src }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          build-args: |
            VOXARBOR_NODE_RELEASE=${{ steps.v.outputs.release || format('sha-{0}', steps.v.outputs.sha) }}
            ${{ matrix.args }}
          labels: |
            org.opencontainers.image.source=https://github.com/voxarbor/node
            org.opencontainers.image.title=VoxArbor Node ${{ matrix.image }}
            org.opencontainers.image.description=VoxArbor Node: self-hosted Ukrainian voice services (${{ matrix.image }})
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.release || format('sha-{0}', steps.v.outputs.sha) }}
          # layer cache in the registry: the GitHub cache (10 GB) was evicted by the 7 GB tts images
          cache-from: type=registry,ref=ghcr.io/voxarbor/node-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/voxarbor/node-${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
