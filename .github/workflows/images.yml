# Worker-node images to GHCR (private): ghcr.io/voxarbor/node-<service>:<version> | sha-<short> | latest.
# A push to main rebuilds only the services whose directory changed; "Run workflow" or a change of the root
# VERSION (the voice-core release) rebuilds all, which then also carry the tag v<VERSION> (what nodes pin).
# Models are not part of these builds except the TTS weights already in its Dockerfile (see docs/worker.md).
name: images
on:
  push:
    branches: [main]
    paths: ["services/tts/**", "services/translate/**", "services/diarize/**", "services/node-info/**", "services/fetch/**", "VERSION", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: images, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [tts, translate, diarize, node-info, fetch]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git rev-parse -q --verify HEAD~1 >/dev/null \
             || git diff --name-only HEAD~1 HEAD | grep -qE '^(services/${{ matrix.service }}/|VERSION$|\.github/workflows/images\.yml)'; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - name: version
        if: steps.changed.outputs.build
        id: v
        run: |
          s=${{ matrix.service }}
          v=$(cat services/$s/VERSION)
          echo "release=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: free disk (the tts image is ~7 GB)
        if: steps.changed.outputs.build && matrix.service == 'tts'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.build
      - uses: docker/login-action@v3
        if: steps.changed.outputs.build
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.build
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/voxarbor/node-${{ matrix.service }}:${{ steps.v.outputs.version }}
            ghcr.io/voxarbor/node-${{ matrix.service }}:sha-${{ steps.v.outputs.sha }}
            ghcr.io/voxarbor/node-${{ matrix.service }}:latest
            ghcr.io/voxarbor/node-${{ matrix.service }}:${{ steps.v.outputs.release }}
          labels: org.opencontainers.image.source=https://github.com/voxarbor/node
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
