# Data image with the Opus-MT tc-big models converted to CTranslate2 int8 (what services/translate/convert_opus.sh does),
# for worker nodes: ghcr.io/voxarbor/node-models-opus:<tag>. Manual only (models change rarely).
name: models-opus
on:
  workflow_dispatch:
    inputs:
      tag: { description: "image tag", default: "1" }
      base: { description: "overlay mode: earlier models tag to start from (empty = convert all from Hugging Face)", default: "" }
      overlay_url: { description: "overlay mode: tgz with replaced pair folders (e.g. en-zle/)", default: "" }
      overlay_sha256: { description: "overlay mode: sha256 of that tgz", default: "" }
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: overlay (replace some pairs of an earlier models image)
        if: inputs.base != ''
        run: |
          mkdir -p ctx/opus-mt && curl -fsSL --retry 5 -o o.tgz "${{ inputs.overlay_url }}"
          echo "${{ inputs.overlay_sha256 }}  o.tgz" | sha256sum -c
          tar xzf o.tgz -C ctx/opus-mt && cp services/models-opus/Dockerfile.overlay ctx/Dockerfile && du -sh ctx/opus-mt/*
      - name: convert
        if: inputs.base == ''
        run: |
          mkdir -p ctx/opus-mt
          docker run --rm -v "$PWD/ctx:/out" python:3.12.12-slim sh -ec '
            pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
            pip install -q transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1 ctranslate2==4.9.0
            for p in en-zle de-zle zle-zle zlw-zle fr-zle es-zle it-zle pt-zle; do
              ct2-transformers-converter --model Helsinki-NLP/opus-mt-tc-big-$p --output_dir /out/opus-mt/$p \
                --quantization int8 --copy_files source.spm target.spm
            done'
          cp services/models-opus/Dockerfile ctx/ && du -sh ctx/opus-mt/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          push: true
          tags: ghcr.io/voxarbor/node-models-opus:${{ inputs.tag }}
          build-args: BASE=ghcr.io/voxarbor/node-models-opus:${{ inputs.base || '1' }}
          labels: org.opencontainers.image.source=https://github.com/voxarbor/node
